name: kyon-replay

services:
  replay:
    image: kyon-replay:ros2
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        REPLAY_UID: ${REPLAY_UID:-1000}
        REPLAY_GID: ${REPLAY_GID:-1000}
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:?Set the ROS domain used by the robot XBot stack}
    volumes:
      - ..:/workspace/kyon_actions
    command: ["sleep", "infinity"]
    restart: "no"
    stdin_open: true
    tty: true
