name: kyon-replay

services:
  replay:
    image: kyon-replay:ros2
    build:
      context: ..
      dockerfile: docker/Dockerfile
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:?Set the ROS domain used by the robot XBot stack}
    volumes:
      - ${REPLAY_DATA_DIR:-../recordings}:/data
    command: ["sleep", "infinity"]
    restart: "no"
    stdin_open: true
    tty: true
